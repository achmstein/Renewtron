name: Build and Deploy

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: ${{ github.repository_owner }}
  SERVER_HOST: ${{ vars.SERVER_HOST }}
  SERVER_USER: ${{ vars.SERVER_USER }}
  REMOTE_DIR: ${{ vars.RENEWTRON_REMOTE_DIR }}

jobs:
  build-and-push:
    name: Build & push images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute image tag
        id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore (with GitHub Packages auth)
        run: dotnet restore Renewtron.Server/Renewtron.Server.csproj

      - name: Build & push Renewtron.Server
        run: |
          dotnet publish Renewtron.Server/Renewtron.Server.csproj \
            --no-restore \
            -c Release \
            /t:PublishContainer \
            /p:ContainerRegistry=${{ env.REGISTRY }} \
            /p:ContainerRepository=${{ env.IMAGE_NAMESPACE }}/renewtron-server \
            /p:ContainerImageTags='"${{ steps.tag.outputs.tag }};latest"'

      - uses: docker/setup-buildx-action@v3

      - name: Build & push renewtron-web
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/renewtron-web:${{ steps.tag.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/renewtron-web:latest
          build-args: |
            VITE_API_URL=https://businessnames.applyforanabn.au

  generate-compose:
    name: Generate docker-compose
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire CLI
        run: dotnet tool install -g Aspire.Cli

      - name: Generate publish artifacts
        run: aspire publish --project Renewtron.AppHost --output-path ./publish --non-interactive

      - name: Write .env
        run: |
          cat > publish/.env <<'EOF'
          RENEWTRON_SERVER_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/renewtron-server:${{ needs.build-and-push.outputs.image_tag }}
          RENEWTRON_WEB_IMAGE=${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/renewtron-web:${{ needs.build-and-push.outputs.image_tag }}
          SQL_PASSWORD=${{ secrets.SQL_PASSWORD }}
          ATO_API_URL=${{ vars.ATO_API_URL }}
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: compose
          path: publish/
          include-hidden-files: true

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: [build-and-push, generate-compose]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: compose
          path: publish/

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts

      - name: Bootstrap server (Docker if missing)
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} bash <<'EOF'
            set -e
            if ! command -v docker >/dev/null 2>&1; then
              curl -fsSL https://get.docker.com | sudo sh
              sudo usermod -aG docker ubuntu
            fi
            mkdir -p ${{ env.REMOTE_DIR }}
            # Writable mount for SettingsService overrides. UID 1654 is the .NET
            # nonroot user inside the published renewtron-server image.
            mkdir -p ${{ env.REMOTE_DIR }}/data
            sudo chown -R 1654:1654 ${{ env.REMOTE_DIR }}/data
          EOF

      - name: Copy compose files
        run: |
          scp -i ~/.ssh/deploy_key \
            publish/docker-compose.yaml \
            publish/.env \
            ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.REMOTE_DIR }}/

      - name: Deploy
        run: |
          ssh -i ~/.ssh/deploy_key ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} bash <<EOF
            set -e
            cd ${{ env.REMOTE_DIR }}
            echo "${{ secrets.GITHUB_TOKEN }}" | sudo docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            sudo docker compose pull
            sudo docker compose up -d
            sudo docker image prune -f
          EOF
